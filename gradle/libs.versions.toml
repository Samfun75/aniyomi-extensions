[versions]
agp_version = "9.4.1"
coroutines_version = "1.10.2"
kotlin_version = "2.4.20"
ktlint_version = "1.8.0"
serialization_version = "1.9.0"
spotless_version = "8.10.2"
tapmoc_version = "0.4.2"

[libraries]
gradle-agp = { module = "com.android.tools.build:gradle", version.ref = "agp_version" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin_version" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless_version" }
gradle-tapmoc = { module = "com.gradleup.tapmoc:tapmoc-gradle-plugin", version.ref = "tapmoc_version" }
ktlint-bom = { module = "com.pinterest.ktlint:ktlint-bom", version.ref = "ktlint_version" }

aniyomi-lib = { module = "com.github.aniyomiorg:extensions-lib", version = "v17" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin_version" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization_version" }
kotlin-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization_version" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines_version" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines_version" }

injekt-core = { module = "com.github.mihonapp:injekt", version = "91edab2317" }
ktvine = { module = "io.github.samfun75:ktvine", version = "1.0.0-RC3" }
jsoup = { module = "org.jsoup:jsoup", version = "1.22.2" }
# jsoup declares jspecify as `provided`, so its nullability annotations need to be added back by hand.
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.4.0" }
quickjs = { module = "app.cash.quickjs:quickjs-android", version = "0.9.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp_version" }
android-library = { id = "com.android.library", version.ref = "agp_version" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kotlin-samWithReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin_version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin_version" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless_version" }

[bundles]
common = ["kotlin-stdlib", "injekt-core", "kotlin-json", "kotlin-json-okio", "jsoup", "jspecify", "okhttp", "aniyomi-lib", "quickjs", "coroutines-core", "coroutines-android"]
